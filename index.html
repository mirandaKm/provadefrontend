<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acessar Amazon</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <header>
        <img src="https://m.media-amazon.com/images/G/01/digital/PV_Logo_Landscape_Smile_Centred_Dark_Squid_Ink_RGB_150._CB554671110_.png" alt="prime video">
    </header>

    <main>
        <div class="login">
            <h1>Fazer login</h1>
            <h3>Insira um número de celular ou um endereço de e-mail</h3>
            <input type="email"><br>
            <button class="continuar">Continuar</button>
            <p>Ao continuar, você concorda com as <a href="#">Condições de uso e Notificação de privacidade</a> da Amazon.</p>
            <p><a href="#">Precisa de ajuda?</a></p>
            <img class="seta" src="https://cdn-icons-png.flaticon.com/512/271/271210.png" alt="setinha">
        </div>

            <button class="conta">Criar sua conta da Amazon</button>

        <footer>
            <hr>
            <div class="">
                <p><a href="#">Termos e aviso de privacidade</a></p>
                <p><a href="#">Enviar feedback</a></p>
                <p><a href="#">Ajuda</a></p>
                
            </div>

            <div>
                <p>© 2021-2026 Amazon.com, Inc. ou suas afiliadas</p>
            </div>
        </footer>
    </main>
</body>
</html>
